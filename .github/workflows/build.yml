name: Build & Package

# 触发：
#   - 手动 workflow_dispatch（直接出 Actions artifact）
#   - 打 tag v* → 额外发布到 GitHub Release
#
# 打包参数全部取自仓库 Variables，无需在触发时填写：
#   PKG_ENV（默认 prod）/ DEPLOY_PATH / LOG_DIR / RPC_PORT
#
# 产物：inkstack-search-<tag>-<arch>.tar.gz + .sha256
on:
  workflow_dispatch:
  push:
    branches:
      - master
      - feature/*
    tags:
      - 'v*'

permissions:
  contents: write

env:
  PKG_ENV: ${{ vars.PKG_ENV || 'prod' }}
  PKG_DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/inkstack-search' }}
  PKG_LOG_DIR: ${{ vars.LOG_DIR || '/data/apps/inkstack-search/logs' }}
  PKG_RPC_PORT: ${{ vars.RPC_PORT || '9010' }}

jobs:
  build:
    name: build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04,     arch: amd64 }
          - { runner: ubuntu-24.04-arm, arch: arm64 }

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Switch apt mirror
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i 's/azure\.archive\.ubuntu\.com/archive.ubuntu.com/g' /etc/apt/apt-mirrors.txt
          fi
          sudo apt-get update

      - name: Install system dependencies
        run: |
          sudo apt-get install -y \
            build-essential \
            ninja-build \
            rsync \
            python3 \
            gettext \
            libboost-context-dev \
            libtool \
            gcc \
            g++ \
            autoconf \
            automake \
            cmake \
            libboost-all-dev \
            libsqlite3-dev \
            libssl-dev \
            libevent-dev \
            libmysqlclient-dev \
            ccache \
            libnghttp2-dev \
            git \
            wget \
            unzip \
            zip

      - name: Fetch chen-sdk + thirdparty deps
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 deps.py sync

      - name: Apply SDK (bin / tools / protocol / resources)
        run: make apply

      - name: Generate protocol headers
        run: make proto

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-search-${{ matrix.arch }}-${{ hashFiles('src/**') }}
          restore-keys: ccache-search-${{ matrix.arch }}-

      - name: Configure (Release, Ninja)
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Prepare prod.env
        if: env.PKG_ENV == 'prod'
        run: |
          {
            printf 'WORK_PATH=%q\n' "${PKG_DEPLOY_PATH}"
            printf 'LOG_DIR=%q\n' "${PKG_LOG_DIR}"
            printf 'INDEX_PATH=%q\n' "${PKG_DEPLOY_PATH}/indices/search.index"
            printf 'DICT_PATH=%q\n' "${PKG_DEPLOY_PATH}/dict"
            printf 'DATA_PATH=%q\n' ""
            printf 'PID_FILE=%q\n' "search.pid"
            printf 'INSTANCE_ID=%q\n' "1"
            printf 'LOG_LEVEL=%q\n' "info"
            printf 'RPC_PORT=%q\n' "${PKG_RPC_PORT}"
            printf 'RELAY_TIMEOUT_MS=%q\n' "3000"
            printf 'IO_THREADS=%q\n' "1"
            printf 'ACCEPT_THREADS=%q\n' "1"
            printf 'REBUILD_ON_START=%q\n' "true"
            printf 'SAVE_INTERVAL_MS=%q\n' "30000"
            printf 'REBUILD_TIMEOUT_MS=%q\n' "600000"
            printf 'MAX_PAGE_SIZE=%q\n' "100"
          } > bin/conf/prod.env

      - name: Package
        run: ./collect.sh "${PKG_ENV}"

      - name: Rename package (tag + arch)
        run: |
          tag="${{ github.ref_type == 'tag' && github.ref_name || 'latest' }}"
          mv inkstack-search-*.tar.gz "inkstack-search-${tag}-${{ matrix.arch }}.tar.gz"
          sha256sum "inkstack-search-${tag}-${{ matrix.arch }}.tar.gz" \
            > "inkstack-search-${tag}-${{ matrix.arch }}.tar.gz.sha256"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: inkstack-search-${{ matrix.arch }}
          path: |
            inkstack-search-*.tar.gz
            inkstack-search-*.tar.gz.sha256
          retention-days: 7
          if-no-files-found: error

  release:
    name: release
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release edit "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --title "${GITHUB_REF_NAME}"
          else
            gh release create "${GITHUB_REF_NAME}" \
              --repo "${GITHUB_REPOSITORY}" --draft --title "${GITHUB_REF_NAME}" \
              --notes "InkStackSearchServer ${GITHUB_REF_NAME}"
          fi
          gh release upload "${GITHUB_REF_NAME}" artifacts/*.tar.gz artifacts/*.sha256 \
            --repo "${GITHUB_REPOSITORY}" --clobber
